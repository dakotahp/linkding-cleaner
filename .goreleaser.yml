version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: linkding-cleaner
    main: ./cmd/linkding-cleaner
    binary: linkding-cleaner
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: linkding-cleaner
    homepage: https://github.com/dakotahp/linkding-cleaner
    description: CLI tool to check and archive dead bookmarks in linkding
    repository:
      owner: dakotahp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "linkding-cleaner"
    test: |
      system "#{bin}/linkding-cleaner", "--version"
