version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: linkding-cleaner
    main: ./cmd/linkding-cleaner
    binary: linkding-cleaner
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# release-please creates the GitHub Release and its notes; GoReleaser only uploads the artifacts.
release:
  mode: keep-existing

changelog:
  disable: true

homebrew_casks:
  - name: linkding-cleaner
    homepage: https://github.com/dakotahp/linkding-cleaner
    description: CLI tool to check and archive dead bookmarks in linkding
    repository:
      owner: dakotahp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    hooks:
      post:
        # The binary is not signed by Apple, so macOS would refuse to run it without this.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/linkding-cleaner"]
          end
